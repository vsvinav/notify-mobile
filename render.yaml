services:
  - type: web
    name: notify-remote
    runtime: node
    plan: free
    numInstances: 1
    autoDeploy: false
    buildCommand: NODE_TLS_REJECT_UNAUTHORIZED=1 npm ci --ignore-scripts
    startCommand: NODE_TLS_REJECT_UNAUTHORIZED=1 node src/hosted-main.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_TLS_REJECT_UNAUTHORIZED
        value: "1"
      # For durable hosting, explicitly set NOTIFY_FIREBASE_PROJECT_ID and
      # NOTIFY_FIREBASE_CREDENTIALS_FILE to your Notify-only Render secret file.
      # Never put the service-account JSON in this blueprint. See docs/render-hosting.md.
