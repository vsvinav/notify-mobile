<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f0e8dc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Review and answer Notify requests on your local network.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" href="/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
  <title>Notify</title>
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <header class="app-header">
    <div class="brand"><img src="/icon-192.png" width="30" height="30" alt=""><span>Notify</span></div>
    <span id="connection" class="connection" role="status">Connecting…</span>
  </header>
  <main id="app" aria-label="Notify requests"></main>
  <footer>On your network. In your hands.<br><span>The Mac must be awake and online.</span></footer>
  <noscript>Enable JavaScript to pair and review requests. No replies can be sent without it.</noscript>
</body>
</html>
